# Reemplaza el default.conf de nginx:alpine (mismo comportamiento) + links cortos del QR (21-oct-2026):
#   /avenida  /norte  (y /localavenida  /localnorte)  -> la misma página del menú; la app lee el local de la dirección.
# Sin "listen [::]:80": si el servidor no tiene IPv6, nginx no arrancaría.
server {
    listen       80;
    server_name  localhost;
    root   /usr/share/nginx/html;

    # redirecciones relativas (se queda en https detrás de Cloudflare/EasyPanel)
    absolute_redirect off;

    # con barra al final las fotos (img/...) se buscarían en /avenida/img/ -> se quita la barra
    location ~* ^/(local)?(avenida|norte)/$ {
        return 301 /$1$2$is_args$args;
    }
    location ~* ^/(local)?(avenida|norte)$ {
        try_files /index.html =404;
    }

    location / {
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
    }
}
